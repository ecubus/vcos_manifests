version: '1.0'
name: pipeline-HaloOS-CI
displayName: HaloOS-CI
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - develop
      precise:
        - master
  pr:
    branches:
      precise:
        - master
stages:
  - name: stage-download-code
    displayName: 代码下载及编译
    strategy: naturally
    trigger: auto
    executor:
      - chaobiao
    steps:
      - step: build@docker
        name: build_docker
        displayName: 镜像构建
        type: account
        repository: https://gitee.com/chaobiao/haloos_ci_docker
        username: openhaloos
        password: chao@gitee.com
        tag: ${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./
        context: ''
        artifacts: []
        isCache: false
        parameter: {}
        notify: []
        strategy:
          retry: '0'
