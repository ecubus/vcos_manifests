version: '1.0'
name: pipeline-HaloOS-build
displayName: HaloOS编译验证
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - feature*
        - develop
      precise:
        - master
  pr:
    branches:
      precise:
        - master
stages:
  - name: stage-download-code
    displayName: 代码下载
    strategy: naturally
    trigger: auto
    executor:
      - chaobiao
    steps:
      - step: shell@agent
        name: execute_download_code
        displayName: Shell 脚本执行
        hostGroupID:
          ID: HaloOS-CI-test1
          hostID:
            - eac9b93d-10bf-4212-ad87-cde28874514d
        script:
          - '# 请在此输入您想执行的脚本'
          - echo '===Get source code==='
          - pwd
          - if [ ! -d "gcode" ];then
          - '    echo "folder not exist, new it"'
          - '    mkdir gcode'
          - else
          - '    rm -rf gcode'
          - '    mkdir gcode'
          - fi
          - cd gcode
          - repo init -u git@gitee.com:haloos/manifests.git -b master -m default.xml
          - repo sync
        notify: []
        strategy:
          retry: '0'
  - name: stage-build-code
    displayName: 编译验证
    strategy: naturally
    trigger: auto
    executor:
      - chaobiao
    steps:
      - step: shell@agent
        name: execute_build_code
        displayName: Shell 脚本执行
        hostGroupID:
          ID: HaloOS-CI-test1
          hostID:
            - eac9b93d-10bf-4212-ad87-cde28874514d
        script:
          - '# 请在此输入您想执行的脚本'
          - echo '===Start build code==='
          - pwd
          - ls
          - cd gcode/build
          # - python vcos_build.py -app_name rt_demo -board_name a2g_tc397_5v_tft -maketool ninja -sim 0 -all
          - python haloos_build.py -app_name rt_demo
        notify: []
        strategy:
          retry: '0'
